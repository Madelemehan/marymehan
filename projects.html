<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0e0e0e" />
  <title>Projects — mary mehan</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="projects">

  <div class="page-hero">
    <div class="wrap">
      <h1 id="proj-heading"></h1>
      <p id="proj-count"></p>
    </div>
  </div>

  <div class="wrap">
    <div class="chips" id="chips"></div>
    <div class="grid-products" id="proj-grid"></div>
  </div>

  <!-- filled from data.js by main.js -->
  <footer class="site-footer"></footer>

  <script src="js/main.js?v=20261006a"></script>
  <script>
    mmPage((data) => {
      const projects = data.projects;
      document.title = projects.title;
      document.getElementById("proj-heading").textContent = projects.heading;

      const grid = document.getElementById("proj-grid");
      const chipsBox = document.getElementById("chips");
      const count = document.getElementById("proj-count");
      const cats = [projects.allLabel, ...new Set(projects.items.map((p) => p.cat))];
      let active = projects.allLabel;

      function draw() {
        const list =
          active === projects.allLabel
            ? projects.items
            : projects.items.filter((p) => p.cat === active);
        renderRow(grid, list);
        count.textContent = `${list.length} work${list.length === 1 ? "" : "s"}`;
      }

      cats.forEach((c) => {
        const b = document.createElement("button");
        b.className = "chip" + (c === active ? " on" : "");
        b.textContent = c;
        b.addEventListener("click", () => {
          active = c;
          chipsBox
            .querySelectorAll(".chip")
            .forEach((x) => x.classList.toggle("on", x === b));
          draw();
        });
        chipsBox.appendChild(b);
      });

      draw();
    });
  </script>
</body>
</html>
