<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0e0e0e" />
  <title>mary mehan — portfolio</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="home">

  <!-- full-screen hero carousel (slides from data.js → home.hero) -->
  <section class="hero" aria-label="Featured">
    <div class="hero-track"></div>
    <div class="hero-progress"></div>
  </section>

  <!-- selected work row -->
  <section class="section">
    <div class="wrap">
      <div class="section-head">
        <h2 id="work-heading"></h2>
        <a class="more" id="work-more"></a>
      </div>
      <div class="scroll-row" id="home-row"></div>
    </div>
  </section>

  <!-- two-column tiles -->
  <section class="section">
    <div class="wrap">
      <div class="section-head">
        <h2 id="explore-heading"></h2>
      </div>
      <div class="grid-2" id="explore-tiles"></div>
    </div>
  </section>

  <!-- statement strip -->
  <section class="statement">
    <div class="wrap">
      <div class="kicker" id="statement-kicker"></div>
      <p id="statement-text"></p>
      <a class="cta" id="statement-cta"></a>
    </div>
  </section>

  <!-- filled from data.js by main.js -->
  <footer class="site-footer"></footer>

  <script src="js/main.js?v=20261007d"></script>
  <script>
    mmPage((data) => {
      const home = data.home;
      const $ = (id) => document.getElementById(id);
      document.title = home.title;

      renderHero(document.querySelector(".hero"), home.hero);
      initHero();

      const work = home.selectedWork;
      $("work-heading").textContent = work.heading;
      $("work-more").textContent = work.more.label;
      $("work-more").href = work.more.href;
      renderRow($("home-row"), data.projects.items.slice(0, work.count));

      $("explore-heading").textContent = home.explore.heading;
      home.explore.tiles.forEach((t) => {
        const a = document.createElement("a");
        a.className = "cat-tile";
        a.href = t.href;
        a.innerHTML = `<span class="tile-label"></span>`;
        const label = a.firstElementChild;
        label.append(t.label);
        const small = document.createElement("small");
        small.textContent = t.sub;
        label.appendChild(small);
        $("explore-tiles").appendChild(a);
      });

      const st = home.statement;
      $("statement-kicker").textContent = st.kicker;
      $("statement-text").textContent = st.text;
      $("statement-cta").textContent = st.cta.label;
      $("statement-cta").href = st.cta.href;
    });
  </script>
</body>
</html>
