<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0e0e0e" />
  <title>Control — mary mehan</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="control">

  <div class="page-hero">
    <div class="wrap">
      <h1>Control</h1>
      <p>Edit site content — saved in this browser</p>
    </div>
  </div>

  <div class="wrap control">

    <!-- site text -->
    <div class="panel">
      <div class="panel-head">Site text</div>
      <div class="panel-body">
        <div class="field">
          <label for="f-tagline">Tagline</label>
          <input id="f-tagline" type="text" />
        </div>
        <div class="field">
          <label for="f-statement">Statement (home page)</label>
          <textarea id="f-statement" rows="3"></textarea>
        </div>
        <div class="field">
          <label for="f-email">Contact email</label>
          <input id="f-email" type="email" />
        </div>
        <button class="btn" id="save-text">Save text</button>
        <div class="notice" id="text-notice"></div>
      </div>
    </div>

    <!-- projects -->
    <div class="panel">
      <div class="panel-head">
        Projects
        <span id="proj-total" style="color: var(--text-faint); font-weight: 400;"></span>
      </div>
      <div class="panel-body">
        <ul class="ctl-list" id="proj-list"></ul>
      </div>
    </div>

    <!-- add project -->
    <div class="panel">
      <div class="panel-head">Add project</div>
      <div class="panel-body">
        <div class="field">
          <label for="p-name">Name</label>
          <input id="p-name" type="text" placeholder="Project name" />
        </div>
        <div class="field">
          <label for="p-cat">Category</label>
          <input id="p-cat" type="text" placeholder="Identity / Editorial / Digital…" />
        </div>
        <div class="field">
          <label for="p-year">Year</label>
          <input id="p-year" type="text" placeholder="2026" />
        </div>
        <div class="field">
          <label for="p-role">Role</label>
          <input id="p-role" type="text" placeholder="Creative Direction" />
        </div>
        <div class="field">
          <label for="p-href">Link (optional)</label>
          <input id="p-href" type="url" placeholder="https://…" />
        </div>
        <div class="field">
          <label for="p-tone">Thumbnail tone</label>
          <select id="p-tone">
            <option value="t-1">Studio 1</option>
            <option value="t-2">Studio 2</option>
            <option value="t-3">Studio 3</option>
            <option value="t-4">Studio 4</option>
            <option value="t-dark">Deep</option>
          </select>
        </div>
        <button class="btn" id="add-proj">Add project</button>
        <div class="notice" id="proj-notice"></div>
      </div>
    </div>

    <!-- reset -->
    <div class="panel">
      <div class="panel-head">Reset</div>
      <div class="panel-body">
        <p style="font-size: 13px; color: var(--text-dim); margin-bottom: 16px;">
          Discard the edits saved in this browser and go back to the content in data.js.
        </p>
        <button class="btn ghost" id="reset-all">Reset to defaults</button>
      </div>
    </div>

  </div>

  <!-- filled from data.js by main.js -->
  <footer class="site-footer"></footer>

  <script src="js/main.js?v=20261005e"></script>
  <script>
    mmPage((loaded) => {
      let data = loaded;

      const $ = (id) => document.getElementById(id);

      function flash(el, msg) {
        el.textContent = msg;
        el.classList.add("ok");
        setTimeout(() => { el.textContent = ""; el.classList.remove("ok"); }, 2500);
      }

      function fillText() {
        $("f-tagline").value = data.site.tagline;
        $("f-statement").value = data.home.statement.text;
        $("f-email").value = data.site.email;
      }

      function drawProjects() {
        const list = $("proj-list");
        list.innerHTML = "";
        $("proj-total").textContent = data.projects.items.length + " total";
        data.projects.items.forEach((p, i) => {
          const li = document.createElement("li");
          const info = document.createElement("div");
          info.innerHTML = `<div class="li-name">${p.name}</div>
            <div class="li-meta">${p.cat} · ${p.year} · ${p.role}</div>`;
          const del = document.createElement("button");
          del.textContent = "Remove";
          del.addEventListener("click", () => {
            data.projects.items.splice(i, 1);
            mmSave(data);
            drawProjects();
          });
          li.appendChild(info);
          li.appendChild(del);
          list.appendChild(li);
        });
      }

      $("save-text").addEventListener("click", () => {
        data.site.tagline = $("f-tagline").value.trim() || data.site.tagline;
        data.home.statement.text = $("f-statement").value.trim() || data.home.statement.text;
        data.site.email = $("f-email").value.trim() || data.site.email;
        mmSave(data);
        fillText();
        flash($("text-notice"), "Saved");
      });

      $("add-proj").addEventListener("click", () => {
        const name = $("p-name").value.trim();
        if (!name) { flash($("proj-notice"), "Name is required"); return; }
        data.projects.items.unshift({
          name,
          cat: $("p-cat").value.trim() || "Uncategorized",
          year: $("p-year").value.trim() || String(new Date().getFullYear()),
          role: $("p-role").value.trim() || "Design",
          tone: $("p-tone").value,
          href: $("p-href").value.trim() || undefined,
        });
        mmSave(data);
        ["p-name", "p-cat", "p-year", "p-role", "p-href"].forEach((id) => ($(id).value = ""));
        drawProjects();
        flash($("proj-notice"), "Added");
      });

      $("reset-all").addEventListener("click", () => {
        if (!confirm("Reset all content to defaults?")) return;
        mmReset();
        data = mmLoad();
        fillText();
        drawProjects();
      });

      fillText();
      drawProjects();
    });
  </script>
</body>
</html>
