name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:          # tests only; deploy is skipped
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # deploys queue up on one group; each pull request gets its own
  group: ${{ github.event_name == 'pull_request' && format('test-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  # The site must pass the tests (tests/*.test.mjs) before it's deployed
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: node --test tests/*.test.mjs
        env:
          REQUIRE_BROWSER: "1"   # fail rather than skip if Chrome is missing

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # llms.txt summarizes data.js for AI tools; built fresh on every deploy.
      # Also stops the deploy if data.js is missing or malformed.
      - name: Build llms.txt
        run: node scripts/build-llms-txt.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
