<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0e0e0e" />
  <title>Store</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="css/store.css" />
</head>
<body data-page="store" data-root="../" data-store-page="search">

  <div class="page-hero">
    <div class="wrap">
      <h1 id="search-heading" data-store-text="heading"></h1>
      <p id="search-subheading" data-store-text="sub"></p>
    </div>
  </div>

  <div class="wrap">
    <form class="search-form" action="search.html" method="get" role="search">
      <div class="field">
        <input id="search-input" name="q" type="search" data-store-placeholder="placeholder" />
      </div>
      <button class="btn" type="submit" data-store-text="button"></button>
    </form>
    <div class="grid-products" id="products-grid"></div>
  </div>

  <!-- filled from data.js by main.js (store links via mmFooterExtra in js/store.js) -->
  <footer class="site-footer"></footer>

  <script src="../js/main.js?v=20261009c"></script>
  <script src="js/store.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
