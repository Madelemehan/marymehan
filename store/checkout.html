<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0e0e0e" />
  <title>Store</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="css/store.css" />
</head>
<body data-page="store" data-root="../" data-store-page="checkout">

  <div class="page-hero">
    <div class="wrap">
      <h1 data-store-text="heading"></h1>
      <p data-store-text="sub"></p>
    </div>
  </div>

  <div class="wrap narrow">
    <!-- shown instead of the checkout when the cart is empty -->
    <div class="empty" id="checkout-empty" hidden>
      <h2>Your cart is empty</h2>
      <p>Add something before checking out.</p>
      <a class="btn ghost" href="index.html">Start shopping</a>
    </div>

    <div id="checkout-body">
      <!-- order summary injected by checkout.js -->
      <div id="checkout-summary"></div>

      <div class="checkout-actions">
        <!-- placeholder until the PayPal SDK is ready -->
        <button class="btn block" id="checkout-loading-btn" disabled>Checkout loading…</button>
        <!-- PayPal buttons render here once the SDK loads -->
        <div id="paypal-button-container" hidden></div>
      </div>
      <p class="notice">Secured by PayPal — we never store your payment details.</p>
    </div>
  </div>

  <!-- filled from data.js by main.js (store links via mmFooterExtra in js/store.js) -->
  <footer class="site-footer"></footer>

  <script src="../js/main.js"></script>
  <script src="js/store.js"></script>
  <script src="js/config.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
