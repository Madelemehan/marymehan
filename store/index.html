<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0e0e0e" />
  <title>Store — mary mehan</title>
  <meta name="description" content="Original works, limited-edition prints, photography, and printed matter by Mary Mehan." />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="css/store.css" />
</head>
<body data-page="store" data-root="../">

  <!-- full-screen hero -->
  <section class="hero" aria-label="Featured">
    <div class="hero-track">
      <div class="hero-slide">
        <div class="slide-art art-2" data-mark="MM"></div>
        <div class="slide-caption">
          <div class="slide-title">Work You<br />Can Keep</div>
          <div class="slide-sub" id="rotating-tagline"></div>
          <div class="hero-ctas">
            <a class="btn" href="category.html">All work</a>
            <a class="btn ghost" href="category.html?category=prints">Shop prints</a>
          </div>
        </div>
      </div>
    </div>
    <div class="hero-progress"></div>
  </section>

  <!-- categories -->
  <section class="section">
    <div class="wrap">
      <div class="section-head">
        <h2>Shop by Category</h2>
      </div>
      <div class="grid-2 grid-4" id="categories-grid"></div>
    </div>
  </section>

  <!-- featured products -->
  <section class="section">
    <div class="wrap">
      <div class="section-head">
        <h2>New Arrivals</h2>
        <a class="more" href="category.html">Shop all</a>
      </div>
      <div class="chips" id="featured-chips"></div>
      <div class="grid-products" id="featured-grid"></div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="wrap">
      <div class="foot-brand">mary mehan</div>
      <div class="foot-links">
        <a href="index.html">Store</a>
        <a href="category.html?category=originals">Originals</a>
        <a href="category.html?category=prints">Prints</a>
        <a href="category.html?category=photography">Photography</a>
        <a href="category.html?category=editions">Editions</a>
        <a href="cart.html">Cart</a>
      </div>
      <div class="foot-links">
        <a href="../index.html">Home</a>
        <a href="../projects.html">Projects</a>
        <a href="../resume.html">Resume</a>
        <a href="../control.html">Control</a>
      </div>
      <div class="foot-fine">
        <span id="foot-email">hello@marymehan.com</span><br />
        © 2026 Mary Mehan. All rights reserved.<br />
        Payments secured by PayPal. We never store your payment details.
      </div>
    </div>
  </footer>

  <script src="../js/main.js"></script>
  <script src="js/store.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
