<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0e0e0e" />
  <title>Store</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="css/store.css" />
</head>
<body data-page="store" data-root="../" data-store-page="home">

  <!-- full-screen hero (text from data.js → store.pages.home.hero) -->
  <section class="hero" aria-label="Featured">
    <div class="hero-track">
      <div class="hero-slide">
        <div class="slide-art art-2"></div>
        <div class="slide-caption">
          <div class="slide-title"></div>
          <div class="slide-sub" id="rotating-tagline"></div>
          <div class="hero-ctas"></div>
        </div>
      </div>
    </div>
    <div class="hero-progress"></div>
  </section>

  <!-- categories -->
  <section class="section">
    <div class="wrap">
      <div class="section-head">
        <h2 data-store-text="categoriesHeading"></h2>
      </div>
      <div class="grid-2 grid-4" id="categories-grid"></div>
    </div>
  </section>

  <!-- featured products -->
  <section class="section">
    <div class="wrap">
      <div class="section-head">
        <h2 data-store-text="featuredHeading"></h2>
        <a class="more" data-store-text="featuredMore.label" data-store-href="featuredMore.href"></a>
      </div>
      <div class="chips" id="featured-chips"></div>
      <div class="grid-products" id="featured-grid"></div>
    </div>
  </section>

  <!-- filled from data.js by main.js (store links via mmFooterExtra in js/store.js) -->
  <footer class="site-footer"></footer>

  <script src="../js/main.js?v=20261007b"></script>
  <script src="js/store.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
