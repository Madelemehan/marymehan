<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0e0e0e" />
  <title>Backstory — Mary Adele Mehan</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="backstory">

  <div class="page-hero">
    <div class="wrap">
      <h1 id="backstory-heading"></h1>
      <p id="backstory-sub"></p>
    </div>
  </div>

  <!-- paragraphs from data.js → backstory.paragraphs -->
  <div class="wrap">
    <div class="backstory-body" id="backstory-body"></div>
  </div>

  <!-- artwork narratives from data.js → backstory.works, in her own words, like a museum label -->
  <div class="wrap">
    <div id="backstory-works"></div>
  </div>

  <!-- filled from data.js by main.js -->
  <footer class="site-footer"></footer>

  <script src="js/main.js?v=20261102b"></script>
  <script>
    mmPage((data) => {
      const backstory = data.backstory;
      document.title = backstory.title;
      document.getElementById("backstory-heading").textContent = backstory.heading;
      document.getElementById("backstory-sub").textContent = backstory.sub;
      const body = document.getElementById("backstory-body");
      backstory.paragraphs.forEach((text) => {
        const p = document.createElement("p");
        p.textContent = text;
        body.appendChild(p);
      });
      const worksBox = document.getElementById("backstory-works");
      (backstory.works || []).forEach((work) => {
        const section = document.createElement("section");
        section.className = "backstory-work";
        const heading = document.createElement("h2");
        heading.textContent = work.name;
        section.appendChild(heading);
        if (work.image) {
          const img = document.createElement("img");
          img.src = work.image;
          img.alt = work.name;
          section.appendChild(img);
        }
        (work.narrative || []).forEach((text) => {
          const p = document.createElement("p");
          p.textContent = text;
          section.appendChild(p);
        });
        worksBox.appendChild(section);
      });
    });
  </script>
</body>
</html>
