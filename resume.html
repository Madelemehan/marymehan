<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0e0e0e" />
  <title>Resume — mary mehan</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="resume">

  <div class="page-hero">
    <div class="wrap">
      <h1 id="resume-heading"></h1>
      <p id="resume-sub"></p>
    </div>
  </div>

  <!-- blocks from data.js → resume.sections, then contact -->
  <div class="wrap resume" id="resume-body">
    <div class="resume-actions">
      <a class="btn" id="email-btn"></a>
      <a class="btn ghost" id="print-btn" href="#" onclick="window.print(); return false;"></a>
    </div>
  </div>

  <!-- filled from data.js by main.js -->
  <footer class="site-footer"></footer>

  <script src="js/main.js"></script>
  <script>
    mmPage((data) => {
      const resume = data.resume;
      const $ = (id) => document.getElementById(id);
      const el = (tag, cls, text) => {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text) e.textContent = text;
        return e;
      };

      document.title = resume.title;
      $("resume-heading").textContent = resume.heading;
      $("resume-sub").textContent = resume.sub;

      function item(when, title, org, text) {
        const row = el("div", "resume-item");
        const what = el("div", "what");
        what.appendChild(el("strong", "", title));
        if (org) what.appendChild(el("em", "", org));
        if (text) what.appendChild(el("p", "", text));
        row.append(el("div", "when", when), what);
        return row;
      }

      // contact comes from the site-wide email and location
      const sections = [
        ...resume.sections,
        {
          heading: resume.contactHeading,
          items: [
            { when: "Email", title: data.site.email },
            { when: "Based in", title: data.site.location },
          ],
        },
      ];

      const actions = document.querySelector(".resume-actions");
      sections.forEach((s) => {
        const block = el("div", "resume-block");
        block.appendChild(el("h3", "", s.heading));
        (s.items || []).forEach((i) => block.appendChild(item(i.when, i.title, i.org, i.text)));
        if (s.tags) {
          const tags = el("div", "skill-tags");
          s.tags.forEach((t) => tags.appendChild(el("span", "", t)));
          block.appendChild(tags);
        }
        $("resume-body").insertBefore(block, actions);
      });

      $("email-btn").textContent = resume.actions.email;
      $("email-btn").href = "mailto:" + data.site.email;
      $("print-btn").textContent = resume.actions.print;
    });
  </script>
</body>
</html>
